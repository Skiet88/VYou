spring.application.name=VYou

spring.datasource.url=jdbc:postgresql://localhost:5432/VYou
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.servlet.context-path=/VYou

spring.profiles.active=development
server.port=8080
openai.api.key=${OPENAI_API_KEY:}

spring.main.allow-bean-definition-overriding=true
spring.webflux.base-path=/VYou
spring.webflux.timeout=5000

#azure.ai.key=${GITHUB_TOKEN}
#ai.github.endpoint=https://models.github.ai/inference
#ai.github.model=openai/gpt-4o


logging.level.org.springframework.security=DEBUG