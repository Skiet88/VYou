spring.application.name=VYou2

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vyou2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only checks it matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# AI provider: GPT-4o on GitHub Models by default (free tier, resets daily).
# Create a fine-grained GitHub token with the "Models: read" permission and export it as GITHUB_TOKEN.
# Any OpenAI-compatible provider works; for Groq set VYOU_LLM_BASE_URL=https://api.groq.com/openai/v1
# and VYOU_LLM_MODEL=openai/gpt-oss-120b.
vyou.llm.base-url=${VYOU_LLM_BASE_URL:https://models.github.ai/inference}
vyou.llm.model=${VYOU_LLM_MODEL:openai/gpt-4o}
vyou.llm.api-key=${VYOU_LLM_API_KEY:${GITHUB_TOKEN:}}
vyou.llm.timeout=30s
vyou.llm.max-attempts=2
vyou.llm.retry-backoff=500ms

vyou.screening.min-words=5

# Fixed per interview; not client-settable (cost control + prevents tampering).
vyou.interview.question-count=${VYOU_QUESTION_COUNT:5}

# AES-256 key for encrypting answers/feedback at rest, base64-encoded 32 bytes.
# Generate one with: openssl rand -base64 32
vyou.security.encryption-key=${VYOU_ENCRYPTION_KEY}
vyou.security.max-request-bytes=${VYOU_MAX_REQUEST_BYTES:65536}

vyou.ratelimit.auth.capacity=${VYOU_RATELIMIT_AUTH_CAPACITY:10}
vyou.ratelimit.auth.refill-period=1m
vyou.ratelimit.ai.capacity=${VYOU_RATELIMIT_AI_CAPACITY:30}
vyou.ratelimit.ai.refill-period=1h

# Frontend dev servers (Vite, CRA/Next). Comma-separated. Must be an exact origin list: CORS
# allows credentials (the session cookie), so a wildcard is never acceptable here.
vyou.cors.allowed-origins=${VYOU_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Server-side session cookie. Secure requires HTTPS; the prod profile keeps it true, dev relaxes it.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${VYOU_COOKIE_SECURE:true}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Swagger UI/OpenAPI JSON. Off by default outside dev/test; see application-prod.properties.
springdoc.api-docs.enabled=${VYOU_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${VYOU_API_DOCS_ENABLED:true}

# Daily sweep that permanently deletes accounts whose 30-day deletion grace period has elapsed.
vyou.account.purge-cron=${VYOU_ACCOUNT_PURGE_CRON:0 0 3 * * *}

# Email verification. Sends through your own address (Gmail works via an App Password: Google
# Account > Security > App passwords; requires 2-Step Verification on). Signup/resend never fail
# if mail isn't configured or the send fails - the account still works, just unverified until a
# link gets through.
spring.mail.host=${VYOU_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${VYOU_MAIL_PORT:587}
spring.mail.username=${VYOU_MAIL_USERNAME:}
spring.mail.password=${VYOU_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Overrides the origin used in verification-email links; leave unset to derive it from the
# request (correct for the normal same-origin deployment described in "Production build" above).
vyou.frontend-base-url=${VYOU_FRONTEND_BASE_URL:}
