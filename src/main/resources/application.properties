spring.application.name=VYou2

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vyou2}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# AI provider: GPT-4o on GitHub Models by default (free tier, resets daily).
# Create a fine-grained GitHub token with the "Models: read" permission and export it as GITHUB_TOKEN.
# Any OpenAI-compatible provider works; for Groq set VYOU_LLM_BASE_URL=https://api.groq.com/openai/v1
# and VYOU_LLM_MODEL=openai/gpt-oss-120b.
vyou.llm.base-url=${VYOU_LLM_BASE_URL:https://models.github.ai/inference}
vyou.llm.model=${VYOU_LLM_MODEL:openai/gpt-4o}
vyou.llm.api-key=${VYOU_LLM_API_KEY:${GITHUB_TOKEN:}}
vyou.llm.timeout=30s

vyou.screening.min-words=5

management.endpoints.web.exposure.include=health
