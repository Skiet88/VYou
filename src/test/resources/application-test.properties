spring.datasource.url=jdbc:h2:mem:vyou2;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
vyou.llm.retry-backoff=1ms
vyou.llm.api-key=
vyou.security.encryption-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
# Most test classes share one Spring context and one test "client IP", so production rate limits
# would make them fail depending on how many tests run and in what order. Limiting itself is
# covered by RateLimitFilterTest, which sets its own small buckets.
vyou.ratelimit.auth.capacity=10000
vyou.ratelimit.ai.capacity=10000
